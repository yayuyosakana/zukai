<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 272" width="450" height="272" data-place-mm="95.25" data-target="md" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP','Yu Gothic',sans-serif" fill="#222222">
<title>Compare effects by group</title>
<desc>Three illustrative effect estimates and 95% confidence intervals compared against zero.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="225.0" y="34.0" font-size="19" text-anchor="middle" font-weight="bold">Compare effects by group</text>
<line x1="106.7" y1="77.0" x2="106.7" y2="208.0" stroke="#dddddd" stroke-width="1"/>
<text x="106.7" y="226.0" font-size="12" text-anchor="middle" fill="#555555">−5</text>
<line x1="176.9" y1="77.0" x2="176.9" y2="208.0" stroke="#dddddd" stroke-width="1"/>
<text x="176.9" y="226.0" font-size="12" text-anchor="middle" fill="#555555">0</text>
<line x1="247.1" y1="77.0" x2="247.1" y2="208.0" stroke="#dddddd" stroke-width="1"/>
<text x="247.1" y="226.0" font-size="12" text-anchor="middle" fill="#555555">5</text>
<line x1="92.7" y1="208.0" x2="289.2" y2="208.0" stroke="#555555" stroke-width="1.5"/>
<text x="190.9" y="250.0" font-size="13" text-anchor="middle">Difference (percentage points)</text>
<line x1="176.9" y1="77.0" x2="176.9" y2="208.0" stroke="#555555" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="307.2" y="69.0" font-size="12" text-anchor="start" fill="#555555">Estimate (95% CI)</text>
<g data-chart="forest">
<text x="80.7" y="103.8" font-size="13" text-anchor="end">Group A</text>
<line x1="190.9" y1="98.8" x2="275.1" y2="98.8" stroke="#222222" stroke-width="1.5"/>
<line x1="190.9" y1="94.8" x2="190.9" y2="102.8" stroke="#222222" stroke-width="1.5"/>
<line x1="275.1" y1="94.8" x2="275.1" y2="102.8" stroke="#222222" stroke-width="1.5"/>
<rect x="228.1" y="93.9" width="9.9" height="9.9" fill="#0072B2" stroke="#ffffff" stroke-width="1"/>
<text x="307.2" y="103.8" font-size="12" text-anchor="start">4 (1, 7)</text>
<text x="80.7" y="147.5" font-size="13" text-anchor="end">Group B</text>
<line x1="148.8" y1="142.5" x2="233.0" y2="142.5" stroke="#222222" stroke-width="1.5"/>
<line x1="148.8" y1="138.5" x2="148.8" y2="146.5" stroke="#222222" stroke-width="1.5"/>
<line x1="233.0" y1="138.5" x2="233.0" y2="146.5" stroke="#222222" stroke-width="1.5"/>
<rect x="186.0" y="137.6" width="9.9" height="9.9" fill="#0072B2" stroke="#ffffff" stroke-width="1"/>
<text x="307.2" y="147.5" font-size="12" text-anchor="start">1 (−2, 4)</text>
<text x="80.7" y="191.2" font-size="13" text-anchor="end">Group C</text>
<line x1="106.7" y1="186.2" x2="190.9" y2="186.2" stroke="#222222" stroke-width="1.5"/>
<line x1="106.7" y1="182.2" x2="106.7" y2="190.2" stroke="#222222" stroke-width="1.5"/>
<line x1="190.9" y1="182.2" x2="190.9" y2="190.2" stroke="#222222" stroke-width="1.5"/>
<rect x="143.9" y="181.2" width="9.9" height="9.9" fill="#0072B2" stroke="#ffffff" stroke-width="1"/>
<text x="307.2" y="191.2" font-size="12" text-anchor="start">−2 (−5, 1)</text>
</g>
</svg>
