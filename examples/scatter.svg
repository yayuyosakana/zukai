<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 272" width="450" height="272" data-place-mm="95.25" data-target="md" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP','Yu Gothic',sans-serif" fill="#222222">
