<rect x="388.0" y="62.0" width="168.0" height="57.0" rx="8" fill="#F8F2A0" stroke="#000000" stroke-width="1.5"/>
<text x="472.0" y="95.8" font-size="15" text-anchor="middle">Check at final size</text>
<line x1="376.0" y1="90.5" x2="385.0" y2="90.5" stroke="#555555" stroke-width="1.5" marker-end="url(#a555555)"/>
<rect x="570.0" y="62.0" width="168.0" height="57.0" rx="8" fill="#E8F6F2" stroke="#009E73" stroke-width="1.5"/>
<text x="654.0" y="95.8" font-size="15" text-anchor="middle">Add a caption</text>
<line x1="558.0" y1="90.5" x2="567.0" y2="90.5" stroke="#555555" stroke-width="1.5" marker-end="url(#a555555)"/>
