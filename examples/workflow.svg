<text x="380.0" y="34.0" font-size="19" text-anchor="middle" font-weight="bold">A figure workflow</text>
<rect x="24.0" y="62.0" width="168.0" height="57.0" rx="8" fill="#E8E8E8" stroke="#555555" stroke-width="1.5"/>
<text x="108.0" y="95.8" font-size="15" text-anchor="middle">Plan the figure</text>
<rect x="206.0" y="62.0" width="168.0" height="57.0" rx="8" fill="#E8F2F8" stroke="#0072B2" stroke-width="1.5"/>
